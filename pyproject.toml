[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-pipeline"
version = "0.1.0"
description = "LLM Document Processing Pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "PyPDF2>=3.0.0",
]

[project.scripts]
doc-pipeline = "doc_pipeline.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]